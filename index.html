<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chỉ Hai Ta</title>
    <!-- PWA Meta tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ec4899">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col select-none">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col space-y-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- Header -->
    <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-bold text-lg bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent">Chỉ 2 Ta 💕</h1>
        <div id="connection-status" class="text-xs px-2.5 py-1 rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/30">Chưa kết nối</div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 pb-24 max-w-md w-full mx-auto p-4 space-y-6">
        
        <!-- TAB 1: TRẠNG THÁI (STATUS) -->
        <div id="tab-status" class="space-y-6">
            
            <!-- Dual Status Display Cards (Giống ảnh mẫu) -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- Card 1: Bạn -->
                <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg relative overflow-hidden flex flex-col justify-between min-h-[140px]">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-pink-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div class="flex justify-between items-start z-10">
                        <span id="my-card-name" class="text-[11px] font-semibold tracking-wider text-pink-400 uppercase truncate max-w-[75%]">Bạn</span>
                        <div class="w-7 h-7 rounded-full bg-pink-600/30 border border-pink-500/40 flex items-center justify-center text-xs shadow-inner">👤</div>
                    </div>
                    <div class="my-3 text-center z-10">
                        <div id="my-card-icon" class="text-3xl mb-1">✨</div>
                        <div id="my-card-status" class="text-xs font-medium text-slate-200 truncate">Chưa cập nhật</div>
                    </div>
                    <span class="text-[9px] text-slate-500 text-center z-10">Trạng thái của bạn</span>
                </div>

                <!-- Card 2: Đối phương -->
                <div class="bg-gradient-to-br from-slate-900 to-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-lg relative overflow-hidden flex flex-col justify-between min-h-[140px]">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-purple-500/5 rounded-full blur-xl pointer-events-none"></div>
                    <div class="flex justify-between items-start z-10">
                        <span id="partner-card-name" class="text-[11px] font-semibold tracking-wider text-purple-400 uppercase truncate max-w-[75%]">Đối phương</span>
                        <div class="w-7 h-7 rounded-full bg-purple-600/30 border border-purple-500/40 flex items-center justify-center text-xs shadow-inner">❤️</div>
                    </div>
                    <div class="my-3 text-center z-10">
                        <div id="partner-card-icon" class="text-3xl mb-1">✨</div>
                        <div id="partner-card-status" class="text-xs font-medium text-slate-200 truncate">Đang chờ kết nối...</div>
                    </div>
                    <span class="text-[9px] text-slate-500 text-center z-10">Trạng thái đối phương</span>
                </div>

            </div>

            <!-- Chọn trạng thái của bạn -->
            <div>
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-3 font-medium">Chọn trạng thái của bạn</p>
                <div class="grid grid-cols-2 gap-3" id="status-grid">
                    <!-- Rendered by JS -->
                </div>
            </div>
        </div>

        <!-- TAB 2: CÀI ĐẶT & KẾT NỐI (SETTINGS) -->
        <div id="tab-settings" class="space-y-6 hidden">
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h2 class="font-bold text-base text-pink-400 border-b border-slate-800 pb-2">Thông tin của bạn</h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Tên của bạn</label>
                    <input type="text" id="my-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500" placeholder="Nhập tên...">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Vai trò trong cặp đôi</label>
                    <select id="my-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500">
                        <option value="user_a">Người dùng 1 (User A)</option>
                        <option value="user_b">Người dùng 2 (User B)</option>
                    </select>
                </div>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h2 class="font-bold text-base text-purple-400 border-b border-slate-800 pb-2">Mã liên kết đôi</h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1">Mã phòng chung (Chia sẻ mã này cho đối phương)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="room-code" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm uppercase tracking-widest font-mono text-center font-bold" placeholder="VD: LOVE99">
                        <button onclick="createOrJoinRoom()" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-5 rounded-xl font-medium text-sm active:scale-95 transition shadow-lg shadow-pink-500/20">Kết nối</button>
                    </div>
                </div>
                <p class="text-xs text-slate-500 leading-relaxed">Cả 2 thiết bị cần nhập chung một Mã phòng và chọn đúng vai trò để thấy trạng thái của nhau.</p>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 py-2 px-6 flex justify-around items-center z-50 max-w-md mx-auto">
        <button onclick="switchTab('status')" id="nav-status" class="flex flex-col items-center text-pink-500 transition">
            <i data-lucide="heart" class="w-6 h-6"></i>
            <span class="text-[10px] mt-1 font-medium">Trạng thái</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-slate-400 transition">
            <i data-lucide="settings" class="w-6 h-6"></i>
            <span class="text-[10px] mt-1 font-medium">Cài đặt</span>
        </button>
    </nav>

    <!-- Script App Logic -->
    <script>
        // CẤU HÌNH SUPABASE CỦA BẠN
        const SUPABASE_URL = 'https://sdwkvjqgsvapzmoylohr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_EzXAd_z0ri8uzIMnBiqh8g_fTe8hhkv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const statuses = [
            { text: 'Vui vẻ 😊', icon: '😊' },
            { text: 'Đang ngủ 😴', icon: '😴' },
            { text: 'Đang chơi game 🎮', icon: '🎮' },
            { text: 'Đang bận 🛑', icon: '🛑' },
            { text: 'Nhớ bạn quá 🥺', icon: '🥺' },
            { text: 'Đang giận dỗi 😤', icon: '😤' },
            { text: 'Đi ăn thôi 🍜', icon: '🍜' },
            { text: 'Đang xem phim 🍿', icon: '🍿' }
        ];

        let currentRoom = localStorage.getItem('couple_room') || '';
        let myRole = localStorage.getItem('couple_role') || 'user_a';
        let myName = localStorage.getItem('couple_name') || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');
        
        let currentMyStatus = localStorage.getItem('my_status_text') || '';
        let currentMyIcon = localStorage.getItem('my_status_icon') || '✨';

        // Load saved settings to inputs
        document.getElementById('room-code').value = currentRoom;
        document.getElementById('my-name').value = myName;
        document.getElementById('my-role').value = myRole;

        renderStatusGrid();
        updateMyCardDisplay();

        if (currentRoom) {
            initRealtime(currentRoom);
        }

        // Toast notification function
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-500/90 text-white border-emerald-400/50' : 'bg-pink-600/90 text-white border-pink-400/50';
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl border backdrop-blur text-xs font-medium flex items-center justify-between transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function switchTab(tab) {
            if (tab === 'status') {
                document.getElementById('tab-status').classList.remove('hidden');
                document.getElementById('tab-settings').classList.add('hidden');
                document.getElementById('nav-status').className = "flex flex-col items-center text-pink-500 transition";
                document.getElementById('nav-settings').className = "flex flex-col items-center text-slate-400 transition";
            } else {
                document.getElementById('tab-status').classList.add('hidden');
                document.getElementById('tab-settings').classList.remove('hidden');
                document.getElementById('nav-status').className = "flex flex-col items-center text-slate-400 transition";
                document.getElementById('nav-settings').className = "flex flex-col items-center text-pink-500 transition";
            }
        }

        function renderStatusGrid() {
            const grid = document.getElementById('status-grid');
            grid.innerHTML = '';
            statuses.forEach(s => {
                const isSelected = currentMyStatus === s.text;
                const btn = document.createElement('button');
                
                let btnClass = "flex items-center space-x-3 p-3.5 rounded-2xl bg-slate-900/80 border active:scale-95 transition text-left relative overflow-hidden ";
                if (isSelected) {
                    btnClass += "border-pink-500 bg-pink-500/10 ring-2 ring-pink-500/40 shadow-md shadow-pink-500/10";
                } else {
                    btnClass += "border-slate-800 hover:border-slate-700";
                }

                btn.className = btnClass;
                btn.innerHTML = `
                    <span class="text-2xl">${s.icon}</span>
                    <span class="text-xs font-medium ${isSelected ? 'text-pink-300 font-semibold' : 'text-slate-200'}">${s.text}</span>
                    ${isSelected ? '<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>' : ''}
                `;
                btn.onclick = () => handleStatusClick(s.text, s.icon);
                grid.appendChild(btn);
            });
        }

        async function handleStatusClick(statusText, icon) {
            // Nếu bấm lại vào trạng thái đang chọn thì hủy chọn
            if (currentMyStatus === statusText) {
                currentMyStatus = '';
                currentMyIcon = '✨';
                localStorage.removeItem('my_status_text');
                localStorage.removeItem('my_status_icon');
                showToast('Đã xóa trạng thái', 'info');
            } else {
                currentMyStatus = statusText;
                currentMyIcon = icon;
                localStorage.setItem('my_status_text', statusText);
                localStorage.setItem('my_status_icon', icon);
                showToast('Đã cập nhật trạng thái: ' + statusText);
                navigator.vibrate && navigator.vibrate(50);
            }

            renderStatusGrid();
            updateMyCardDisplay();

            if (currentRoom) {
                await syncStatusToServer(currentMyStatus, currentMyIcon);
            }
        }

        function updateMyCardDisplay() {
            document.getElementById('my-card-name').innerText = myName || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');
            document.getElementById('my-card-icon').innerText = currentMyStatus ? currentMyIcon : '✨';
            document.getElementById('my-card-status').innerText = currentMyStatus || 'Chưa cập nhật';
        }

        async function createOrJoinRoom() {
            currentRoom = document.getElementById('room-code').value.trim().toUpperCase();
            myRole = document.getElementById('my-role').value;
            myName = document.getElementById('my-name').value.trim() || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');

            if (!currentRoom) {
                showToast('Vui lòng nhập mã phòng!', 'error');
                return;
            }

            localStorage.setItem('couple_room', currentRoom);
            localStorage.setItem('couple_role', myRole);
            localStorage.setItem('couple_name', myName);

            updateMyCardDisplay();

            const { data } = await supabaseClient.from('couple_rooms').select('*').eq('code', currentRoom).single();
            if (!data) {
                await supabaseClient.from('couple_rooms').insert([{ code: currentRoom }]);
            }

            await syncStatusToServer(currentMyStatus, currentMyIcon);

            showToast('Kết nối phòng thành công!');
            switchTab('status');
            initRealtime(currentRoom);
        }

        async function syncStatusToServer(statusText, icon) {
            if (!currentRoom) return;
            myRole = document.getElementById('my-role').value;
            myName = document.getElementById('my-name').value.trim() || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');

            const updateData = myRole === 'user_a' 
                ? { user_a_name: myName, user_a_status: statusText, user_a_icon: icon, updated_at: new Date() }
                : { user_b_name: myName, user_b_status: statusText, user_b_icon: icon, updated_at: new Date() };

            await supabaseClient.from('couple_rooms').update(updateData).eq('code', currentRoom);
        }

        function initRealtime(roomCode) {
            const statusBadge = document.getElementById('connection-status');
            statusBadge.innerText = 'Đã kết nối';
            statusBadge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";

            fetchRoomData(roomCode);

            supabaseClient
                .channel('room-changes-' + roomCode)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'couple_rooms', filter: `code=eq.${roomCode}` }, payload => {
                    renderCouple(payload.new);
                })
                .subscribe();
        }

        async function fetchRoomData(roomCode) {
            const { data } = await supabaseClient.from('couple_rooms').select('*').eq('code', roomCode).single();
            if (data) renderCouple(data);
        }

        function renderCouple(data) {
            myRole = document.getElementById('my-role').value;
            const isA = myRole === 'user_a';

            // Dữ liệu của tôi từ server (hoặc giữ local nếu mới)
            const myServerName = isA ? data.user_a_name : data.user_b_name;
            if (myServerName) {
                document.getElementById('my-card-name').innerText = myServerName;
            }

            // Dữ liệu đối phương
            const partnerName = isA ? (data.user_b_name || 'Bạn B') : (data.user_a_name || 'Bạn A');
            const partnerStatus = isA ? (data.user_b_status || 'Chưa cập nhật') : (data.user_a_status || 'Chưa cập nhật');
            const partnerIcon = isA ? (data.user_b_icon || '✨') : (data.user_a_icon || '✨');

            document.getElementById('partner-card-name').innerText = partnerName;
            document.getElementById('partner-card-status').innerText = partnerStatus;
            document.getElementById('partner-card-icon').innerText = partnerIcon;
        }

        lucide.createIcons();
    </script>
</body>
</html>
