<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chỉ Hai Ta</title>
    <!-- PWA Meta tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ec4899">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col select-none">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 left-1/2 -translate-x-1/2 z-[100] flex flex-col space-y-2 w-11/12 max-w-sm pointer-events-none"></div>

    <!-- Header -->
    <header class="p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 flex justify-between items-center sticky top-0 z-50">
        <h1 class="font-bold text-lg bg-gradient-to-r from-pink-500 to-purple-500 bg-clip-text text-transparent flex items-center gap-2">
            <i data-lucide="heart" class="w-5 h-5 text-pink-500 fill-pink-500 animate-pulse"></i> Chỉ 2 Ta 💕
        </h1>
        <div id="connection-status" class="text-xs px-2.5 py-1 rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-ping"></span> Chưa kết nối
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 pb-24 max-w-md w-full mx-auto p-4 space-y-6">
        
        <!-- TAB 1: TRẠNG THÁI (STATUS) -->
        <div id="tab-status" class="space-y-6">
            
            <!-- Dual Status Display Cards -->
            <div class="grid grid-cols-2 gap-3">
                
                <!-- Card 1: Bạn -->
                <div class="bg-gradient-to-br from-slate-900/90 to-slate-900/50 border border-slate-800/80 rounded-2xl p-4 shadow-xl relative overflow-hidden flex flex-col justify-between min-h-[140px] backdrop-blur">
                    <div class="absolute -top-10 -right-10 w-28 h-28 bg-pink-500/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="flex justify-between items-start z-10">
                        <span id="my-card-name" class="text-[11px] font-bold tracking-wider text-pink-400 uppercase truncate max-w-[75%]">Bạn</span>
                        <div class="w-7 h-7 rounded-full bg-pink-600/20 border border-pink-500/30 flex items-center justify-center text-xs text-pink-400 shadow-inner">
                            <i data-lucide="user" class="w-3.5 h-3.5"></i>
                        </div>
                    </div>
                    <div class="my-2 text-center z-10 flex flex-col items-center">
                        <div id="my-card-icon" class="w-10 h-10 mb-1 rounded-xl bg-pink-500/10 border border-pink-500/20 flex items-center justify-center text-pink-400">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div id="my-card-status" class="text-xs font-semibold text-slate-200 truncate max-w-full">Chưa cập nhật</div>
                    </div>
                    <span class="text-[9px] text-slate-500 text-center z-10 font-medium">Trạng thái của bạn</span>
                </div>

                <!-- Card 2: Đối phương -->
                <div class="bg-gradient-to-br from-slate-900/90 to-slate-900/50 border border-slate-800/80 rounded-2xl p-4 shadow-xl relative overflow-hidden flex flex-col justify-between min-h-[140px] backdrop-blur">
                    <div class="absolute -top-10 -right-10 w-28 h-28 bg-purple-500/10 rounded-full blur-2xl pointer-events-none"></div>
                    <div class="flex justify-between items-start z-10">
                        <span id="partner-card-name" class="text-[11px] font-bold tracking-wider text-purple-400 uppercase truncate max-w-[75%]">Đối phương</span>
                        <div class="w-7 h-7 rounded-full bg-purple-600/20 border border-purple-500/30 flex items-center justify-center text-xs text-purple-400 shadow-inner">
                            <i data-lucide="heart" class="w-3.5 h-3.5"></i>
                        </div>
                    </div>
                    <div class="my-2 text-center z-10 flex flex-col items-center">
                        <div id="partner-card-icon" class="w-10 h-10 mb-1 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400">
                            <i data-lucide="sparkles" class="w-5 h-5"></i>
                        </div>
                        <div id="partner-card-status" class="text-xs font-semibold text-slate-200 truncate max-w-full">Đang chờ kết nối...</div>
                    </div>
                    <span class="text-[9px] text-slate-500 text-center z-10 font-medium">Trạng thái đối phương</span>
                </div>

            </div>

            <!-- Chọn trạng thái của bạn -->
            <div>
                <p class="text-xs uppercase tracking-wider text-slate-400 mb-3 font-medium flex items-center gap-1.5">
                    <i data-lucide="smile" class="w-3.5 h-3.5 text-pink-500"></i> Chọn trạng thái của bạn
                </p>
                <div class="grid grid-cols-2 gap-3" id="status-grid"></div>
            </div>
        </div>

        <!-- TAB 2: CÀI ĐẶT & KẾT NỐI (SETTINGS) -->
        <div id="tab-settings" class="space-y-6 hidden">
            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur">
                <h2 class="font-bold text-base text-pink-400 border-b border-slate-800/80 pb-2 flex items-center gap-2">
                    <i data-lucide="user-cog" class="w-4 h-4"></i> Thông tin của bạn
                </h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1 font-medium">Tên của bạn</label>
                    <input type="text" id="my-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 transition" placeholder="Nhập tên...">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1 font-medium">Vai trò trong cặp đôi</label>
                    <select id="my-role" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-pink-500 transition">
                        <option value="user_a">Người dùng 1 (User A)</option>
                        <option value="user_b">Người dùng 2 (User B)</option>
                    </select>
                </div>
                <button onclick="requestNotificationPermission()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 border border-slate-700">
                    <i data-lucide="bell" class="w-4 h-4 text-pink-400"></i> Bật thông báo đẩy trên điện thoại
                </button>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-5 space-y-4 backdrop-blur">
                <h2 class="font-bold text-base text-purple-400 border-b border-slate-800/80 pb-2 flex items-center gap-2">
                    <i data-lucide="link" class="w-4 h-4"></i> Mã liên kết đôi
                </h2>
                <div>
                    <label class="text-xs text-slate-400 block mb-1 font-medium">Mã phòng chung (Gửi mã này cho đối phương)</label>
                    <div class="flex space-x-2">
                        <input type="text" id="room-code" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm uppercase tracking-widest font-mono text-center font-bold text-pink-400" placeholder="VD: LOVE99">
                        <button onclick="createOrJoinRoom()" class="bg-gradient-to-r from-pink-500 to-purple-600 text-white px-5 rounded-xl font-medium text-sm active:scale-95 transition shadow-lg shadow-pink-500/20 whitespace-nowrap">Kết nối</button>
                    </div>
                </div>
                <p class="text-xs text-slate-500 leading-relaxed">Cả 2 thiết bị cần nhập chung một Mã phòng và chọn đúng vai trò để đồng bộ trạng thái thời gian thực.</p>
            </div>
        </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur border-t border-slate-800 py-2.5 px-6 flex justify-around items-center z-50 max-w-md mx-auto">
        <button onclick="switchTab('status')" id="nav-status" class="flex flex-col items-center text-pink-500 transition">
            <i data-lucide="heart" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Trạng thái</span>
        </button>
        <button onclick="switchTab('settings')" id="nav-settings" class="flex flex-col items-center text-slate-400 transition">
            <i data-lucide="settings" class="w-5 h-5"></i>
            <span class="text-[10px] mt-1 font-medium">Cài đặt</span>
        </button>
    </nav>

    <!-- Script App Logic -->
    <script>
        const SUPABASE_URL = 'https://sdwkvjqgsvapzmoylohr.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_EzXAd_z0ri8uzIMnBiqh8g_fTe8hhkv';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const statuses = [
            { text: 'Vui vẻ 😊', icon: 'smile', symbol: '😊' },
            { text: 'Đang ngủ 😴', icon: 'moon', symbol: '😴' },
            { text: 'Chơi game 🎮', icon: 'gamepad-2', symbol: '🎮' },
            { text: 'Đang bận 🛑', icon: 'ban', symbol: '🛑' },
            { text: 'Nhớ bạn 🥺', icon: 'heart', symbol: '🥺' },
            { text: 'Giận dỗi 😤', icon: 'frown', symbol: '😤' },
            { text: 'Đi ăn thôi 🍜', icon: 'utensils', symbol: '🍜' },
            { text: 'Xem phim 🍿', icon: 'film', symbol: '🍿' }
        ];

        let currentRoom = localStorage.getItem('couple_room') || '';
        let myRole = localStorage.getItem('couple_role') || 'user_a';
        let myName = localStorage.getItem('couple_name') || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');
        
        let currentMyStatus = localStorage.getItem('my_status_text') || '';
        let currentMyIconName = localStorage.getItem('my_status_icon_name') || 'sparkles';
        let lastPartnerStatus = '';
        let pollInterval = null;

        document.getElementById('room-code').value = currentRoom;
        document.getElementById('my-name').value = myName;
        document.getElementById('my-role').value = myRole;

        renderStatusGrid();
        updateMyCardDisplay();

        if (currentRoom) {
            initRealtime(currentRoom);
        } else {
            showToast('Chưa có mã phòng! Hãy vào Cài đặt để kết nối.', 'error');
        }

        function playMessageSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch (e) {
                console.log('Audio error:', e);
            }
        }

        async function requestNotificationPermission() {
            if (!("Notification" in window)) {
                showToast('Trình duyệt không hỗ trợ thông báo!', 'error');
                return;
            }
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                showToast('Đã bật thông báo điện thoại thành công!');
                new Notification("Chỉ 2 Ta 💕", {
                    body: "Hệ thống thông báo đã sẵn sàng hoạt động!",
                    icon: "https://img.icons8.com/color/192/hearts.png"
                });
            } else {
                showToast('Bạn đã từ chối quyền thông báo.', 'info');
            }
        }

        function showPhoneNotification(title, bodyText) {
            if (Notification.permission === "granted") {
                try {
                    new Notification(title, {
                        body: bodyText,
                        icon: "https://img.icons8.com/color/192/hearts.png",
                        tag: "couple-status",
                        renotify: true
                    });
                } catch (e) {
                    console.log(e);
                }
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-500/90 text-white border-emerald-400/50' : (type === 'info' ? 'bg-blue-600/90 text-white border-blue-400/50' : 'bg-pink-600/90 text-white border-pink-400/50');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-2xl border backdrop-blur text-xs font-semibold flex items-center justify-between transition-all duration-300 transform translate-y-2 opacity-0 ${bgClass}`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function switchTab(tab) {
            if (tab === 'status') {
                document.getElementById('tab-status').classList.remove('hidden');
                document.getElementById('tab-settings').classList.add('hidden');
                document.getElementById('nav-status').className = "flex flex-col items-center text-pink-500 transition";
                document.getElementById('nav-settings').className = "flex flex-col items-center text-slate-400 transition";
            } else {
                document.getElementById('tab-status').classList.add('hidden');
                document.getElementById('tab-settings').classList.remove('hidden');
                document.getElementById('nav-status').className = "flex flex-col items-center text-slate-400 transition";
                document.getElementById('nav-settings').className = "flex flex-col items-center text-pink-500 transition";
            }
        }

        function renderStatusGrid() {
            const grid = document.getElementById('status-grid');
            grid.innerHTML = '';
            statuses.forEach(s => {
                const isSelected = currentMyStatus === s.text;
                const btn = document.createElement('button');
                
                let btnClass = "flex items-center space-x-3 p-3.5 rounded-2xl bg-slate-900/80 border active:scale-95 transition text-left relative overflow-hidden backdrop-blur ";
                if (isSelected) {
                    btnClass += "border-pink-500 bg-pink-500/10 ring-2 ring-pink-500/40 shadow-lg shadow-pink-500/10";
                } else {
                    btnClass += "border-slate-800 hover:border-slate-700";
                }

                btn.className = btnClass;
                btn.innerHTML = `
                    <div class="w-9 h-9 rounded-xl ${isSelected ? 'bg-pink-500/20 text-pink-400 border border-pink-500/30' : 'bg-slate-800 text-slate-300 border border-slate-700'} flex items-center justify-center transition">
                        <i data-lucide="${s.icon}" class="w-5 h-5"></i>
                    </div>
                    <span class="text-xs font-semibold ${isSelected ? 'text-pink-300' : 'text-slate-200'}">${s.text}</span>
                    ${isSelected ? '<span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-pink-500 animate-pulse"></span>' : ''}
                `;
                btn.onclick = () => handleStatusClick(s.text, s.icon);
                grid.appendChild(btn);
            });
            lucide.createIcons();
        }

        async function handleStatusClick(statusText, iconName) {
            if (!currentRoom) {
                showToast('Vui lòng vào tab Cài đặt để kết nối mã phòng trước!', 'error');
                switchTab('settings');
                return;
            }

            if (currentMyStatus === statusText) {
                currentMyStatus = '';
                currentMyIconName = 'sparkles';
                localStorage.removeItem('my_status_text');
                localStorage.removeItem('my_status_icon_name');
                showToast('Đã xóa trạng thái', 'info');
            } else {
                currentMyStatus = statusText;
                currentMyIconName = iconName;
                localStorage.setItem('my_status_text', statusText);
                localStorage.setItem('my_status_icon_name', iconName);
                showToast('Đã chọn: ' + statusText);
                navigator.vibrate && navigator.vibrate(50);
            }

            renderStatusGrid();
            updateMyCardDisplay();
            await syncStatusToServer(currentMyStatus, currentMyIconName);
        }

        function updateMyCardDisplay() {
            myName = document.getElementById('my-name').value.trim() || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');
            document.getElementById('my-card-name').innerText = myName;
            document.getElementById('my-card-status').innerText = currentMyStatus || 'Chưa cập nhật';
            
            const iconContainer = document.getElementById('my-card-icon');
            iconContainer.innerHTML = `<i data-lucide="${currentMyStatus ? currentMyIconName : 'sparkles'}" class="w-5 h-5"></i>`;
            lucide.createIcons();
        }

        async function createOrJoinRoom() {
            currentRoom = document.getElementById('room-code').value.trim().toUpperCase();
            myRole = document.getElementById('my-role').value;
            myName = document.getElementById('my-name').value.trim() || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');

            if (!currentRoom) {
                showToast('Vui lòng nhập mã phòng!', 'error');
                return;
            }

            localStorage.setItem('couple_room', currentRoom);
            localStorage.setItem('couple_role', myRole);
            localStorage.setItem('couple_name', myName);

            updateMyCardDisplay();

            const { error } = await supabaseClient.from('couple_rooms').upsert([{ code: currentRoom }], { onConflict: 'code', ignoreDuplicates: true });
            if (error) {
                showToast('Lỗi tạo phòng: ' + error.message, 'error');
                return;
            }

            await syncStatusToServer(currentMyStatus, currentMyIconName);

            showToast('Kết nối phòng thành công!');
            switchTab('status');
            initRealtime(currentRoom);
        }

        async function syncStatusToServer(statusText, iconName) {
            if (!currentRoom) return;
            myRole = document.getElementById('my-role').value;
            myName = document.getElementById('my-name').value.trim() || (myRole === 'user_a' ? 'Bạn A' : 'Bạn B');

            const updateData = myRole === 'user_a' 
                ? { user_a_name: myName, user_a_status: statusText, user_a_icon: iconName, updated_at: new Date() }
                : { user_b_name: myName, user_b_status: statusText, user_b_icon: iconName, updated_at: new Date() };

            const { error } = await supabaseClient.from('couple_rooms').update(updateData).eq('code', currentRoom);
            if (error) {
                showToast('Lỗi đồng bộ: ' + error.message, 'error');
            }
        }

        async function initRealtime(roomCode) {
            const statusBadge = document.getElementById('connection-status');
            statusBadge.innerHTML = '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span> Đã kết nối';
            statusBadge.className = "text-xs px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1.5";

            await fetchRoomData(roomCode);

            supabaseClient.getChannels().forEach(c => supabaseClient.removeChannel(c));

            supabaseClient
                .channel('room-changes-' + roomCode)
                .on('postgres_changes', { event: '*', schema: 'public', table: 'couple_rooms', filter: `code=eq.${roomCode}` }, payload => {
                    if (payload.new) {
                        renderCouple(payload.new);
                    }
                })
                .subscribe();

            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                fetchRoomData(roomCode);
            }, 3000);
        }

        async function fetchRoomData(roomCode) {
            const { data, error } = await supabaseClient.from('couple_rooms').select('*').eq('code', roomCode).maybeSingle();
            if (error) {
                console.error("Fetch error:", error);
                return;
            }
            if (data) {
                renderCouple(data);
            }
        }

        function renderCouple(data) {
            myRole = document.getElementById('my-role').value;
            const isA = myRole === 'user_a';

            const myServerName = isA ? data.user_a_name : data.user_b_name;
            if (myServerName && !document.getElementById('my-name').value) {
                document.getElementById('my-name').value = myServerName;
            }
            document.getElementById('my-card-name').innerText = document.getElementById('my-name').value.trim() || (isA ? 'Bạn A' : 'Bạn B');

            const partnerName = isA ? (data.user_b_name || 'Đối phương') : (data.user_a_name || 'Đối phương');
            const partnerStatus = isA ? (data.user_b_status || 'Chưa cập nhật') : (data.user_a_status || 'Chưa cập nhật');
            const partnerIcon = isA ? (data.user_b_icon || 'sparkles') : (data.user_a_icon || 'sparkles');

            if (lastPartnerStatus !== partnerStatus && lastPartnerStatus !== '' && lastPartnerStatus !== 'Chưa cập nhật' && partnerStatus !== 'Chưa cập nhật') {
                playMessageSound();
                showPhoneNotification(`Trạng thái mới từ ${partnerName}`, `${partnerName}: ${partnerStatus}`);
                showToast(`${partnerName} vừa đổi trạng thái: ${partnerStatus}`, 'info');
            }
            lastPartnerStatus = partnerStatus;

            document.getElementById('partner-card-name').innerText = partnerName;
            document.getElementById('partner-card-status').innerText = partnerStatus;
            
            const partnerIconContainer = document.getElementById('partner-card-icon');
            partnerIconContainer.innerHTML = `<i data-lucide="${partnerIcon}" class="w-5 h-5"></i>`;
            
            lucide.createIcons();
        }

        lucide.createIcons();
    </script>
</body>
</html>
